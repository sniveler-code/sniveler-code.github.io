name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Optimize images
        run: npm run build:images

      - name: Build docs
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la *.html
          ls -la assets/
          test -f sitemap.xml && echo "sitemap.xml ✓" || echo "sitemap.xml ✗"
          test -f robots.txt && echo "robots.txt ✓" || echo "robots.txt ✗"
          test -f 404.html && echo "404.html ✓" || echo "404.html ✗"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4