<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniveler Code | {{PROJECT_TITLE}} Documentation</title>
    <meta name="description" content="{{PROJECT_DESCRIPTION}}">
    
    <!-- Open Graph / Twitter Card -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sniveler Code | {{PROJECT_TITLE}} Documentation">
    <meta property="og:description" content="{{PROJECT_DESCRIPTION}}">
    <meta property="og:image" content="https://sniveler-code.github.io/Images/sniveler_logo.png">
    <meta property="og:url" content="https://sniveler-code.github.io/docs_{{PROJECT_SLUG}}.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sniveler Code | {{PROJECT_TITLE}} Documentation">
    <meta name="twitter:description" content="{{PROJECT_DESCRIPTION}}">
    <meta name="twitter:image" content="https://sniveler-code.github.io/Images/sniveler_logo.png">
    
    <!-- Canonical -->
    <link rel="canonical" href="https://sniveler-code.github.io/docs_{{PROJECT_SLUG}}.html">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Highlight.js (self-hosted) -->
    <link rel="stylesheet" href="assets/highlight.css">
    
    <!-- Shared Docs Styles -->
    <link rel="stylesheet" href="assets/docs.css">
</head>
<body>
    <nav>
        <div class="container">
            <a href="index.html" class="logo-link">
                <img src="Images/sniveler_logo.png" alt="Sniveler Code Logo" class="nav-logo">
            </a>
            <div class="nav-links">
                <a href="index.html#assets">// BACK TO ASSETS</a>
                <a href="https://discord.gg/b2f7ZZA4Rw" target="_blank">// DISCORD</a>
            </div>
        </div>
    </nav>

    <div class="docs-container">
        <aside class="sidebar">
            <details class="mobile-nav" id="nav-details" open>
                <summary>☰ TABLE OF CONTENTS</summary>
                <div id="sidebar-content">
                    {{SIDEBAR_CONTENT}}
                </div>
            </details>
        </aside>
        
        <main class="content-area">
            {{MAIN_CONTENT}}
            
            <!-- Edit on GitHub / Version -->
            <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <a href="https://github.com/sniveler-code/sniveler-code.github.io/edit/main/documentation/{{PROJECT_SLUG}}/" target="_blank" rel="noopener" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.5rem 1rem;">
                    Edit on GitHub
                </a>
                <span class="mono" style="color: var(--text-secondary); font-size: 0.85rem;">v1.0.0</span>
            </div>
        </main>
    </div>

    <!-- Shared Docs JS -->
    <script src="assets/docs.js"></script>
    
    <!-- Highlight.js (self-hosted) -->
    <script src="assets/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">{{JSON_LD}}</script>
</body>
</html>
